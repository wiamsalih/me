<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Illustrative cover (not a product screenshot): the approval journey as a path of steps, one flagged as stalled -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6ee"/>
      <stop offset="1" stop-color="#f9d4b5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#f8be82" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f8be82" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- journey path -->
  <path d="M120 640 C 360 640, 380 360, 620 360 S 900 600, 1120 520 S 1400 260, 1500 260"
        fill="none" stroke="#5a4239" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>
  <path d="M120 640 C 360 640, 380 360, 620 360 S 860 560, 960 572"
        fill="none" stroke="#5a4239" stroke-width="3" stroke-linecap="round"/>

  <!-- completed steps -->
  <g fill="#1a1310">
    <circle cx="120" cy="640" r="18"/>
    <circle cx="352" cy="520" r="18"/>
    <circle cx="620" cy="360" r="18"/>
  </g>
  <g stroke="#fdf6ee" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M111 640 l6 6 l12 -13"/>
    <path d="M343 520 l6 6 l12 -13"/>
    <path d="M611 360 l6 6 l12 -13"/>
  </g>

  <!-- stalled step -->
  <circle cx="960" cy="572" r="64" fill="#d4756a" fill-opacity="0.18"/>
  <circle cx="960" cy="572" r="30" fill="#b85e6a"/>
  <rect x="948" y="559" width="7" height="26" rx="2" fill="#fdf6ee"/>
  <rect x="965" y="559" width="7" height="26" rx="2" fill="#fdf6ee"/>

  <!-- upcoming steps -->
  <g fill="#fdf6ee" stroke="#5a4239" stroke-width="3">
    <circle cx="1240" cy="420" r="16"/>
    <circle cx="1500" cy="260" r="16"/>
  </g>

  <!-- title -->
  <text x="120" y="190" font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-size="132" fill="#1a1310">Bridge</text>
  <text x="124" y="246" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="30" fill="#5a4239">Seeing the whole approval journey</text>
</svg>
