<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Illustrative cover (not a product screenshot): allocation, performance and risk shown together -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6ee"/>
      <stop offset="1" stop-color="#f4c9a8"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- title -->
  <text x="120" y="190" font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-size="104" fill="#1a1310">Portfolio, at a glance</text>
  <text x="124" y="244" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="30" fill="#5a4239">Allocation · Performance · Risk</text>

  <!-- allocation ring -->
  <g transform="translate(330 590)" fill="none" stroke-width="58">
    <circle r="150" stroke="#8e4a6e" stroke-dasharray="395 548" transform="rotate(-90)"/>
    <circle r="150" stroke="#d4756a" stroke-dasharray="245 698" stroke-dashoffset="-395" transform="rotate(-90)"/>
    <circle r="150" stroke="#f4b48a" stroke-dasharray="170 773" stroke-dashoffset="-640" transform="rotate(-90)"/>
    <circle r="150" stroke="#5a4239" stroke-dasharray="133 810" stroke-dashoffset="-810" transform="rotate(-90)"/>
  </g>

  <!-- performance line -->
  <g transform="translate(640 400)">
    <line x1="0" y1="340" x2="520" y2="340" stroke="#5a4239" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M0 290 C 60 280, 90 230, 140 240 S 230 300, 280 220 S 380 140, 430 160 S 500 90, 520 80"
          fill="none" stroke="#1a1310" stroke-width="5" stroke-linecap="round"/>
    <circle cx="520" cy="80" r="11" fill="#1a1310"/>
  </g>

  <!-- risk bars -->
  <g transform="translate(1260 400)">
    <rect x="0"   y="230" width="44" height="110" rx="10" fill="#f4b48a"/>
    <rect x="68"  y="170" width="44" height="170" rx="10" fill="#d4756a"/>
    <rect x="136" y="90"  width="44" height="250" rx="10" fill="#b85e6a"/>
    <rect x="204" y="200" width="44" height="140" rx="10" fill="#8e4a6e"/>
    <line x1="-10" y1="340" x2="258" y2="340" stroke="#5a4239" stroke-opacity="0.35" stroke-width="2"/>
  </g>
</svg>
